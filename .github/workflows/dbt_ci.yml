Replace the `Download prod manifest` step and add the upload step after the prod run. Here's the full updated file:

name: dbt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dbt_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-snowflake==1.8.4 snowflake-connector-python cryptography

      - name: Set target
        id: set_target
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "target=prod" >> $GITHUB_OUTPUT
          else
            echo "target=ci" >> $GITHUB_OUTPUT
          fi

      - name: Set up dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          supply_chain_dbt:
            target: ${{ steps.set_target.outputs.target }}
            outputs:
              ci:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.DBT_USER }}"
                role: DBT_ROLE
                private_key: "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}"
                private_key_passphrase: "${{ secrets.PRIVATE_KEY_PASSPHRASE }}"
                database: SUPPLY_CHAIN
                schema: "PR_${{ github.run_id }}"
                warehouse: DEV_WH
                threads: 4
              prod:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.DBT_USER }}"
                role: DBT_ROLE
                private_key: "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}"
                private_key_passphrase: "${{ secrets.PRIVATE_KEY_PASSPHRASE }}"
                database: SUPPLY_CHAIN
                schema: PROD
                warehouse: DEV_WH
                threads: 4
          EOF

      - name: Install dbt packages
        working-directory: supply_chain_dbt
        run: dbt deps

      - name: Seed data
        working-directory: supply_chain_dbt
        run: dbt seed

      - name: Download prod manifest
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v3
        with:
          name: prod-manifest
          path: supply_chain_dbt/prod_manifest/
        continue-on-error: true

      - name: Run dbt slim CI (PR branch)
        if: github.event_name == 'pull_request'
        working-directory: supply_chain_dbt
        run: |
          if [ -f prod_manifest/manifest.json ]; then
            echo "Manifest found — running slim CI"
            dbt build --target ci \
              --select state:modified+ \
              --defer \
              --state prod_manifest/
          else
            echo "No manifest found — running full build"
            dbt build --target ci
          fi

      - name: Run dbt (main branch)
        if: github.ref == 'refs/heads/main'
        working-directory: supply_chain_dbt
        run: dbt build --target prod

      - name: Upload prod manifest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: prod-manifest
          path: supply_chain_dbt/target/manifest.json
          retention-days: 90

      - name: Drop CI schemas
        if: github.event_name == 'pull_request'
        working-directory: supply_chain_dbt
        run: |
          python - <<EOF
          import snowflake.connector
          import os
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.backends import default_backend

          key = load_pem_private_key(
              os.environ['SNOWFLAKE_PRIVATE_KEY'].encode(),
              password=os.environ['PRIVATE_KEY_PASSPHRASE'].encode(),
              backend=default_backend()
          )

          conn = snowflake.connector.connect(
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              user=os.environ['DBT_USER'],
              private_key=key,
              role='DBT_ROLE',
              warehouse='DEV_WH',
              database='SUPPLY_CHAIN'
          )

          run_id = os.environ['GITHUB_RUN_ID']
          schemas = [
              f"PR_{run_id}_ANALYTICS",
              f"PR_{run_id}_STAGING",
              f"PR_{run_id}",
          ]
          for schema in schemas:
              conn.cursor().execute(f"DROP SCHEMA IF EXISTS SUPPLY_CHAIN.{schema}")
              print(f"Dropped schema {schema}")

          conn.close()
          EOF
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          DBT_USER: ${{ secrets.DBT_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.PRIVATE_KEY_PASSPHRASE }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "Pipeline failed on ${{ github.ref }} — triggered by ${{ github.actor }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"